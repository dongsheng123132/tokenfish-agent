      <h1 class="tf-play-title">微信付款</h1>
      <p class="tf-play-message" id="pay-message" hidden></p>
      <div id="pay-body" hidden>
        <p class="tf-amount" id="pay-amount"></p>
        <p class="tf-kv">订单号：<strong id="pay-order"></strong></p>
        <div class="tf-qr" id="pay-qr"></div>
        <p class="tf-kv">用手机微信「扫一扫」付款。如果你就在手机上打开本页，请长按二维码，选「识别图中二维码」。</p>
        <p class="tf-price-note">付款后回到 AI 对话说『好了』，AI 会帮你查到账。</p>
      </div>
    </div>

    <div class="tf-cta-row">
      <a class="tf-btn tf-btn-secondary" href="https://www.u-claw.org.cn">虾盘云官网</a>
